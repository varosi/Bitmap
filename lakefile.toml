name = "bitmap"
version = "0.10.0"
keywords = ["graphics", "image", "bitmap", "png"]
defaultTargets = ["Bitmap"]
testDriver = "bitmap_tests"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
lang.lemmaCmd = true

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "cb3961288e99f02ee3d23aab55391aebb258fd0c"

[[lean_lib]]
name = "Bitmap"

[[lean_exe]]
name = "bitmap_tests"
root = "Bitmap.Tests"
