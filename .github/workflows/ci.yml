name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.lane }} ${{ matrix.lean_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: lean-4.30
            lean_version: v4.30.0
            toolchain: leanprover/lean4:v4.30.0
          - lane: lean-4.31
            lean_version: v4.31.0
            toolchain: leanprover/lean4:v4.31.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Forbid implemented_by on main
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: ./scripts/check-no-implemented-by-on-main.sh

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Select Lean/Lake toolchain
        run: |
          printf '%s\n' "${{ matrix.toolchain }}" > lean-toolchain
          cat lean-toolchain

      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
          key: ${{ runner.os }}-lake-deps-${{ matrix.lean_version }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-${{ matrix.lean_version }}-

      - name: Cache project build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
          key: ${{ runner.os }}-lake-build-${{ matrix.lean_version }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'Bitmap.lean', 'Bitmap/**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-build-${{ matrix.lean_version }}-

      - name: Install selected Lean/Lake
        run: |
          elan toolchain install "${{ matrix.toolchain }}"
          lean --version
          lake --version

      - name: Update dependencies
        run: lake update

      - name: Build
        run: lake build

      - name: Test
        run: lake test
